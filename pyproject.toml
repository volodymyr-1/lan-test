[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lan-test"
version = "0.1.0"
description = "FastAPI monitoring service — test bed for langgraph-lab pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
lan-test = "lan_test.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lan_test"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
